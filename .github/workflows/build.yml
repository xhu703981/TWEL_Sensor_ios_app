name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build
      run: |
        xcodebuild \
          -project nRFapp.xcodeproj \
          -scheme nRFapp \
          -sdk iphoneos \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build \
          CONFIGURATION_BUILD_DIR=./build

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r ./build/nRFapp.app Payload/
        zip -r nRFapp.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: nRFapp
        path: nRFapp.ipa
